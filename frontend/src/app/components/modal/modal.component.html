@if (isOpen()) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 dark:bg-slate-950/80 backdrop-blur-xs animate-fade-in"
    (click)="onBackdropClick($event)"
  >
    <div
      class="w-full max-w-md bg-white dark:bg-slate-900 rounded-2xl shadow-xl border border-white dark:border-slate-800 overflow-hidden animate-scale-in"
      role="dialog"
      aria-modal="true"
    >
      <div class="p-6">
        <div class="flex items-start gap-4">
          <div
            class="shrink-0 w-11 h-11 rounded-xl flex items-center justify-center"
            [class.bg-rose-100]="variant() === 'danger'"
            [class.text-rose-600]="variant() === 'danger'"
            [class.dark:bg-rose-950/50]="variant() === 'danger'"
            [class.dark:text-rose-400]="variant() === 'danger'"
            [class.bg-amber-100]="variant() === 'warning'"
            [class.text-amber-600]="variant() === 'warning'"
            [class.dark:bg-amber-950/50]="variant() === 'warning'"
            [class.dark:text-amber-400]="variant() === 'warning'"
            [class.bg-indigo-100]="variant() === 'primary'"
            [class.text-indigo-600]="variant() === 'primary'"
            [class.dark:bg-indigo-950/50]="variant() === 'primary'"
            [class.dark:text-indigo-400]="variant() === 'primary'"
          >
            @if (variant() === 'danger') {
              <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
              </svg>
            } @else if (variant() === 'warning') {
              <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
              </svg>
            } @else {
              <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
            }
          </div>

          <div class="flex-1">
            <h3 class="text-lg font-bold text-slate-900 dark:text-white leading-6">{{ title() }}</h3>
            <p class="mt-1.5 text-sm text-slate-600 dark:text-slate-300 leading-relaxed">{{ message() }}</p>
          </div>
        </div>
      </div>

      <div class="px-6 py-4 bg-slate-50 dark:bg-slate-800/80 border-t border-slate-100 dark:border-slate-800 flex items-center justify-end gap-2.5">
        <app-button
          variant="outline"
          [disabled]="loading()"
          (clicked)="handleCancel()"
        >
          {{ cancelText() }}
        </app-button>
        <app-button
          [variant]="variant() === 'danger' ? 'danger' : 'primary'"
          [loading]="loading()"
          (clicked)="handleConfirm()"
        >
          {{ confirmText() }}
        </app-button>
      </div>
    </div>
  </div>
}
