<div class="w-full flex flex-col gap-1.5">
  @if (label()) {
    <label [for]="id()" class="text-xs font-semibold text-slate-700 tracking-wide flex items-center gap-1">
      <span>{{ label() }}</span>
      @if (required()) {
        <span class="text-rose-500 font-bold" title="Kötelező mező">*</span>
      }
    </label>
  }

  <div class="relative rounded-xl shadow-xs transition-all duration-150">
    <select
      [id]="id()"
      [value]="value()"
      [disabled]="isDisabled() || disabledInput()"
      (change)="handleChange($event)"
      (blur)="handleBlur()"
      class="w-full h-10 pl-3.5 pr-10 py-2 text-sm bg-white text-slate-900 border rounded-xl appearance-none transition-all duration-150 focus:outline-none focus:ring-2 focus:ring-offset-0 disabled:bg-slate-100 disabled:text-slate-500 disabled:cursor-not-allowed cursor-pointer"
      [class.border-slate-300]="!errorMessage()"
      [class.hover:border-slate-400]="!errorMessage()"
      [class.focus:border-indigo-500]="!errorMessage()"
      [class.focus:ring-indigo-500/20]="!errorMessage()"
      [class.border-rose-400]="!!errorMessage()"
      [class.focus:border-rose-500]="!!errorMessage()"
      [class.focus:ring-rose-500/20]="!!errorMessage()"
      [class.bg-rose-50/20]="!!errorMessage()"
    >
      @if (placeholder()) {
        <option value="" disabled [selected]="!value()">{{ placeholder() }}</option>
      }
      @for (opt of options(); track opt.value) {
        <option [value]="opt.value">{{ opt.label }}</option>
      }
    </select>

    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3.5 text-slate-400">
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
      </svg>
    </div>
  </div>

  @if (errorMessage()) {
    <p class="text-xs font-medium text-rose-600 animate-slide-down flex items-center gap-1">
      <svg class="w-3.5 h-3.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
      </svg>
      <span>{{ errorMessage() }}</span>
    </p>
  } @else if (hint()) {
    <p class="text-xs text-slate-500">{{ hint() }}</p>
  }
</div>
