<div class="flex flex-col items-center justify-center text-center p-8 sm:p-12 bg-white rounded-2xl border border-dashed border-slate-200">
  <div class="w-14 h-14 rounded-2xl bg-slate-50 border border-slate-100 flex items-center justify-center text-slate-400 mb-4 shadow-2xs">
    <app-icon [name]="icon()" size="lg"></app-icon>
  </div>

  <h3 class="text-base font-semibold text-slate-800">{{ title() }}</h3>
  <p class="text-xs sm:text-sm text-slate-500 max-w-sm mt-1 leading-relaxed">{{ message() }}</p>

  @if (actionText()) {
    <div class="mt-5">
      <app-button variant="outline" size="sm" (clicked)="handleAction()">
        {{ actionText() }}
      </app-button>
    </div>
  }
</div>
