@if (isOpen()) {
  <div
    class="fixed inset-0 z-40 bg-slate-900/40 backdrop-blur-xs lg:hidden animate-fade-in"
    (click)="close.emit()"
  ></div>
}

<aside
  class="fixed lg:sticky top-0 lg:top-16 z-40 h-full lg:h-[calc(100vh-4rem)] w-64 bg-white border-r border-slate-200/80 p-4 flex flex-col justify-between transition-transform duration-200 ease-in-out shrink-0"
  [class.translate-x-0]="isOpen()"
  [class.-translate-x-full]="!isOpen()"
  [class.lg:translate-x-0]="true"
>
  <div class="flex flex-col gap-6">
    <div class="flex items-center justify-between lg:hidden pb-3 border-b border-slate-100">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white">
          <app-icon name="building" size="sm"></app-icon>
        </div>
        <span class="font-bold text-slate-900">StayAdmin</span>
      </div>
      <button
        type="button"
        (click)="close.emit()"
        class="p-1.5 rounded-lg text-slate-400 hover:text-slate-600 hover:bg-slate-100"
      >
        <app-icon name="x" size="sm"></app-icon>
      </button>
    </div>

    <div class="space-y-1">
      <span class="px-3 text-[11px] font-bold text-slate-400 uppercase tracking-wider block mb-2">
        Főmenü
      </span>
      @for (item of navItems; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="bg-indigo-50 text-indigo-700 font-semibold shadow-2xs border-indigo-200/60"
          [routerLinkActiveOptions]="{ exact: false }"
          (click)="handleNavigate()"
          class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-50 transition-all border border-transparent"
        >
          <app-icon [name]="item.icon" size="sm"></app-icon>
          <span>{{ item.label }}</span>
        </a>
      }
    </div>
  </div>

  <div class="p-3.5 rounded-xl bg-slate-50 border border-slate-100 text-xs text-slate-500">
    <div class="font-semibold text-slate-700 mb-0.5">StayAdmin Rendszer</div>
    <div class="text-[11px]">Szálláshely és foglalás kezelő</div>
  </div>
</aside>
