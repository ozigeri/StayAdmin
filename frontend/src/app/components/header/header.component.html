<header class="h-16 px-4 sm:px-6 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-b border-slate-200/80 dark:border-slate-800 flex items-center justify-between sticky top-0 z-30 transition-colors">
  <div class="flex items-center gap-3">
    <button
      type="button"
      (click)="handleToggleSidebar()"
      class="lg:hidden p-2 rounded-xl text-slate-500 hover:text-slate-700 hover:bg-slate-100 dark:text-slate-400 dark:hover:text-slate-200 dark:hover:bg-slate-800 transition-colors"
      aria-label="Menü megnyitása"
    >
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>

    <div class="flex items-center gap-2.5">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-indigo-500 flex items-center justify-center text-white shadow-xs">
        <app-icon name="building" size="sm"></app-icon>
      </div>
      <div>
        <h1 class="text-base font-bold text-slate-900 dark:text-white tracking-tight leading-none">StayAdmin</h1>
        <span class="text-[10px] font-medium text-slate-400 dark:text-slate-500 uppercase tracking-wider block mt-0.5">Adminisztráció</span>
      </div>
    </div>
  </div>

  <div class="flex items-center gap-2.5 sm:gap-3.5">
    <button
      type="button"
      (click)="toggleTheme()"
      class="w-9 h-9 rounded-xl flex items-center justify-center text-slate-600 hover:text-slate-900 bg-slate-100 hover:bg-slate-200/80 dark:bg-slate-800 dark:text-slate-300 dark:hover:text-white dark:hover:bg-slate-700 transition-colors cursor-pointer"
      [title]="isDark() ? 'Váltás világos módra' : 'Váltás sötét módra'"
      [attr.aria-label]="isDark() ? 'Váltás világos módra' : 'Váltás sötét módra'"
    >
      @if (isDark()) {
        <app-icon name="sun" size="sm"></app-icon>
      } @else {
        <app-icon name="moon" size="sm"></app-icon>
      }
    </button>

    <div class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-100/80 dark:bg-slate-800 border border-slate-200/60 dark:border-slate-700">
      <div class="w-6 h-6 rounded-full bg-indigo-100 text-indigo-700 flex items-center justify-center text-xs font-semibold">
        <app-icon name="user" size="xs"></app-icon>
      </div>
      <span class="text-xs font-semibold text-slate-700 dark:text-slate-200">{{ username() }}</span>
    </div>

    <app-button
      variant="outline"
      size="sm"
      (clicked)="handleLogout()"
    >
      <app-icon name="logout" size="sm"></app-icon>
      <span class="hidden sm:inline">Kijelentkezés</span>
    </app-button>
  </div>
</header>
