<div [class]="containerClasses()" (click)="handleClick()">
  <div [class]="accentIndicatorClasses()"></div>

  <div class="flex items-start justify-between gap-3">
    <div class="flex-1">
      <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider block">
        {{ title() }}
      </span>
      <div [class]="valueClasses()">
        {{ value() }}
      </div>
      @if (subtext()) {
        <p class="text-xs text-slate-500 mt-1.5">{{ subtext() }}</p>
      }
    </div>
    <div class="shrink-0 p-2.5 rounded-xl bg-slate-50 text-slate-500 border border-slate-100">
      <ng-content select="[stat-icon]"></ng-content>
    </div>
  </div>
</div>
