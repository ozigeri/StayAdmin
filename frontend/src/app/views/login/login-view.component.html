<div class="min-h-screen w-full flex items-center justify-center p-4 bg-gradient-to-b from-slate-50 to-slate-100">
  <div class="w-full max-w-md bg-white rounded-3xl shadow-xl border border-slate-200/80 p-8 sm:p-10 animate-scale-in">
    <div class="flex flex-col items-center text-center mb-8">
      <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-indigo-600 to-indigo-500 flex items-center justify-center text-white shadow-md mb-4">
        <app-icon name="building" size="lg"></app-icon>
      </div>
      <h2 class="text-2xl font-bold text-slate-900 tracking-tight">StayAdmin</h2>
      <p class="text-sm text-slate-500 mt-1">Jelentkezzen be az adminisztrációs felületre</p>
    </div>

    @if (errorMessage()) {
      <div class="mb-6 p-4 rounded-2xl bg-rose-50 border border-rose-200 text-rose-700 text-xs sm:text-sm font-medium flex items-center gap-3 animate-slide-down">
        <app-icon name="x" size="sm" customClass="text-rose-500 shrink-0"></app-icon>
        <span class="flex-1">{{ errorMessage() }}</span>
      </div>
    }

    <form [formGroup]="loginForm" (ngSubmit)="handleSubmit()" class="space-y-4">
      <app-input
        label="Felhasználónév"
        placeholder="pl. Admin"
        formControlName="username"
        [required]="true"
        [errorMessage]="loginForm.get('username')?.touched && loginForm.get('username')?.errors?.['required'] ? 'A felhasználónév megadása kötelező' : null"
      ></app-input>

      <app-input
        type="password"
        label="Jelszó"
        placeholder="••••••••"
        formControlName="password"
        [required]="true"
        [errorMessage]="loginForm.get('password')?.touched && loginForm.get('password')?.errors?.['required'] ? 'A jelszó megadása kötelező' : null"
      ></app-input>

      <div class="pt-2">
        <app-button
          type="submit"
          variant="primary"
          [fullWidth]="true"
          [loading]="loading()"
        >
          Bejelentkezés
        </app-button>
      </div>
    </form>

    <div class="mt-8 pt-6 border-t border-slate-100 text-center">
      <p class="text-xs text-slate-400">
        Fejlesztői fiók: <span class="font-semibold text-slate-600">Admin</span> / <span class="font-semibold text-slate-600">1234</span>
      </p>
    </div>
  </div>
</div>
